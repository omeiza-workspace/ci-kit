name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          additional_files: |
            bin/ci
            bin/install.sh
            lib/*.sh
            tests/*.sh
          # -x follows the source directives, so the kit's own libraries are
          # checked with the files that use them.
          args: "-x"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run the test suite
        run: tests/run.sh

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the base image
        run: docker build -f docker/Dockerfile -t ci-kit:base .
      - name: Build the toolbox image
        run: docker build -f docker/Dockerfile.toolbox -t ci-kit:toolbox .
      - name: Smoke test the base image
        run: |
          docker run --rm ci-kit:base version
          docker run --rm -v "$PWD:/work" ci-kit:base config
